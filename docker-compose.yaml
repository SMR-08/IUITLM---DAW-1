# docker-compose.yaml (Raíz del Proyecto - Integrado)
version: '3.8'
#╔═══════════════════════════════════════╗
#║  Iniciar y Construir Contenedores:    ║
#║  docker-compose up -d --build         ║
#╠═══════════════════════════════════════╣
#║  Detener Contenedores:                ║
#║  docker-compose down                  ║
#╚═══════════════════════════════════════╝
# Define los servicios (contenedores) que componen la aplicación.
services:
  # --- Servicios Originales ---
  nginx:
    container_name: nginx
    build:
      context: ./Introduccion/docker
      dockerfile: nginx.dockerfile
    ports:
      - "80:80"
    networks:
      - red_www
    depends_on:
      - php-fpm
      - angular
      - python-api
      - experimental-backend # Añadido por si nginx necesita hacer proxy a él
      - experimental-frontend # Añadido por si nginx necesita hacer proxy a él
    volumes:
      - ./Introduccion/docker/www:/var/www/html
      - ./Introduccion/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./Introduccion/docker/nginx/angular.conf:/etc/nginx/conf.d/angular.conf
      - ./Introduccion/docker/nginx/api.conf:/etc/nginx/conf.d/api.conf
      # Monta el código de la API PHP para que Nginx pueda servirlo si es necesario (o pasar a php-fpm)
      - ./API/PHP:/var/www/html/api_php
      # Monta también los archivos estáticos del frontend experimental si Nginx los va a servir directamente
      # (Alternativa al proxy_pass, depende de cómo configures nginx/experimental.conf)
      # - ./Experimental/frontend/build:/usr/share/nginx/html/experimental # Ejemplo si sirves build estático

  php-fpm:
    container_name: php-fpm
    build:
      context: ./Introduccion/docker
      dockerfile: php.dockerfile
    networks:
      - red_www
    volumes:
      # Monta el código fuente web, compartido con Nginx.
      - ./Introduccion/docker/www:/var/www/html:cached
      # Monta el código de la API PHP para que php-fpm pueda ejecutarlo
      - ./API/PHP:/var/www/html/api_php:cached
    working_dir: /var/www/html

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_BANCO_NAME} # Crea BD Banco por defecto
      MARIADB_USER: ${DB_BANCO_USER}
      MARIADB_PASSWORD: ${DB_BANCO_PASSWORD}
      # Nota: Las otras BDs (InventarioDB, CochesDB) se crean mediante el script SQL.
    networks:
      - red_www
    volumes:
      - mariadb_data:/var/lib/mysql
      # Monta el script SQL para inicializar todas las bases de datos y usuarios necesarios.
      - ./BBDD/Banco:/docker-entrypoint-initdb.d

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      # Puedes añadir PMA_USER y PMA_PASSWORD si quieres preconfigurar un login,
      # pero es más seguro loguearse manualmente.
    networks:
      - red_www
    depends_on:
      - mariadb

  angular:
    container_name: angular
    build:
      context: ./Introduccion/angular/app-test
      dockerfile: angular.dockerfile # Este Dockerfile construye y sirve con Nginx interno
    networks:
      - red_www
    # Nota: Este servicio Angular ya incluye Nginx. El Nginx principal (arriba)
    # hace proxy_pass a este servicio en angular.localhost. No necesita exponer puertos al host directamente.

  python-api:
    container_name: python-api
    build:
      context: ./API
      dockerfile: api.dockerfile
    ports:
      # Expone el puerto del HOST definido en .env (default 5000) al puerto INTERNO 8000
      - "${API_PORT_HOST:-5000}:${API_PORT_CONTAINER:-8000}"
    networks:
      - red_www
    depends_on:
      - mariadb
    environment:
      # Pasa todas las variables de entorno necesarias para la API Python
      - DB_HOST=${DB_HOST}
      - DB_BANCO_NAME=${DB_BANCO_NAME}
      - DB_BANCO_USER=${DB_BANCO_USER}
      - DB_BANCO_PASSWORD=${DB_BANCO_PASSWORD}
      - DB_INVENTARIO_NAME=${DB_INVENTARIO_NAME}
      - DB_INVENTARIO_USER=${DB_INVENTARIO_USER}
      - DB_INVENTARIO_PASSWORD=${DB_INVENTARIO_PASSWORD}
      - DB_COCHES_NAME=${DB_COCHES_NAME}
      - DB_COCHES_USER=${DB_COCHES_USER}
      - DB_COCHES_PASSWORD=${DB_COCHES_PASSWORD}
      - API_PORT_CONTAINER=${API_PORT_CONTAINER:-8000} # Puerto interno donde escucha Gunicorn/Flask
      - FLASK_DEBUG=${FLASK_DEBUG:-false} # Para activar modo debug si se desea
    volumes:
      # Monta el código de la API Python para desarrollo (hot-reloading)
      - ./API/Python:/app:cached

  # --- Servicios Experimentales Integrados ---

  experimental-backend:
    container_name: experimental-backend
    build:
      context: ./Experimental/backend # Ruta relativa a la raíz del proyecto
      dockerfile: Dockerfile # Dockerfile dentro del contexto
    ports:
      # Expone el puerto 8001 del HOST al 8000 del CONTENEDOR para evitar conflicto con python-api
      - "8001:8000"
    networks:
      - red_www
    volumes:
      # Monta el código del backend experimental para desarrollo
      - ./Experimental/backend:/app:cached
    # El comando 'uvicorn main:app --host 0.0.0.0 --reload' se toma del Dockerfile de Experimental/backend

  experimental-frontend:
    container_name: experimental-frontend
    build:
      context: ./Experimental/frontend # Ruta relativa a la raíz del proyecto
      dockerfile: Dockerfile # Dockerfile dentro del contexto
    ports:
      # Expone el puerto 3000 del HOST al 3000 del CONTENEDOR (React Dev Server)
      - "3000:3000"
    networks:
      - red_www
    volumes:
      # Monta el código del frontend experimental para desarrollo (hot-reloading)
      # Evita montar node_modules para usar los instalados en la imagen
      - ./Experimental/frontend:/app:cached
      - /app/node_modules # Truco para usar node_modules de la imagen y no del host
    depends_on:
      - experimental-backend # Depende del backend experimental
    environment:
      - WATCHPACK_POLLING=true # Necesario para hot-reloading en algunos entornos Docker
    # Asumiendo que el comando `npm start` está en el Dockerfile de Experimental/frontend
    # Si no, añádelo aquí:
    # command: npm start

# --- Volúmenes Persistentes ---
volumes:
  mariadb_data: # Volumen para persistir los datos de MariaDB

# --- Redes ---
networks:
  red_www: # Red común para que los contenedores se comuniquen por nombre de servicio